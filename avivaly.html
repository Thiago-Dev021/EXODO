<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avivaly — Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-night:#181527;
    --bg-night-2:#211d36;
    --panel:#241f3a;
    --panel-border:#3a3358;
    --sand:#EDE4D3;
    --ink:#2b2418;
    --stone:#a79bce;
    --stone-dim:#6f6690;
    --gold:#c9962c;
    --gold-bright:#e8b84b;
    --ember:#9a4a34;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(201,150,44,0.14), transparent 60%),
      linear-gradient(180deg, var(--bg-night) 0%, var(--bg-night-2) 100%);
    font-family:'Inter', sans-serif;
    color:var(--sand);
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  /* ---------- Top bar: pillar of fire ---------- */
  .topbar{
    position:relative;
    padding:22px 24px 18px;
    text-align:center;
    border-bottom:1px solid var(--panel-border);
    overflow:hidden;
  }
  .topbar::before{
    content:"";
    position:absolute; left:0; right:0; top:0; height:3px;
    background:linear-gradient(90deg, transparent, var(--gold-bright), var(--ember), var(--gold-bright), transparent);
    background-size:200% 100%;
    animation:flicker 4s ease-in-out infinite;
  }
  @keyframes flicker{
    0%,100%{background-position:0% 0;}
    50%{background-position:100% 0;}
  }
  .topbar h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:30px;
    letter-spacing:0.5px;
    margin:0 0 4px;
    color:var(--gold-bright);
  }
  .topbar p{
    margin:0;
    font-size:13px;
    color:var(--stone-dim);
  }
  .topbar a.back{
    position:absolute; left:24px; top:24px;
    font-size:12px; color:var(--stone-dim); text-decoration:none;
    font-family:'JetBrains Mono', monospace;
  }
  .topbar a.back:hover{color:var(--gold-bright);}

  /* ---------- Layout ---------- */
  .layout{
    flex:1;
    display:grid;
    grid-template-columns:260px 1fr;
    max-width:1100px;
    width:100%;
    margin:0 auto;
    gap:20px;
    padding:24px;
  }
  @media (max-width:760px){
    .layout{grid-template-columns:1fr; padding:14px;}
    .sidebar{order:2;}
    .chat-col{order:1;}
  }

  /* ---------- Sidebar: scroll of questions ---------- */
  .sidebar{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:var(--radius);
    padding:18px;
    height:fit-content;
  }
  .sidebar h2{
    font-family:'Cormorant Garamond', serif;
    font-size:16px;
    font-weight:600;
    color:var(--gold-bright);
    margin:0 0 12px;
    letter-spacing:0.5px;
  }
  .suggestion{
    display:block;
    width:100%;
    text-align:left;
    background:transparent;
    border:none;
    border-left:2px solid var(--panel-border);
    color:var(--stone);
    font-family:'Inter', sans-serif;
    font-size:13px;
    line-height:1.4;
    padding:8px 0 8px 12px;
    margin-bottom:2px;
    cursor:pointer;
    transition:border-color .15s, color .15s;
  }
  .suggestion:hover{
    border-left-color:var(--gold);
    color:var(--sand);
  }

  /* ---------- Chat column ---------- */
  .chat-col{
    display:flex;
    flex-direction:column;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:var(--radius);
    overflow:hidden;
    min-height:520px;
  }
  .messages{
    flex:1;
    overflow-y:auto;
    padding:22px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .messages::-webkit-scrollbar{width:8px;}
  .messages::-webkit-scrollbar-thumb{background:var(--panel-border); border-radius:4px;}

  .empty-state{
    margin:auto;
    text-align:center;
    color:var(--stone-dim);
    font-size:13px;
    max-width:320px;
    line-height:1.6;
  }
  .empty-state span{font-size:22px; display:block; margin-bottom:8px;}

  .msg{
    display:flex;
    gap:10px;
    max-width:88%;
  }
  .msg.user{align-self:flex-end; flex-direction:row-reverse;}
  .msg .avatar{
    flex-shrink:0;
    width:26px; height:26px;
    border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    font-weight:500;
  }
  .msg.assistant .avatar{background:linear-gradient(135deg, var(--gold), var(--ember)); color:#1a1428;}
  .msg.user .avatar{background:var(--panel-border); color:var(--stone);}

  .bubble{
    font-size:14px;
    line-height:1.6;
    padding:10px 14px;
    border-radius:var(--radius);
    white-space:pre-wrap;
  }
  .msg.assistant .bubble{
    background:var(--bg-night-2);
    border:1px solid var(--panel-border);
    border-top-left-radius:2px;
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
  }
  .msg.user .bubble{
    background:var(--gold);
    color:#1a1428;
    border-top-right-radius:2px;
    font-weight:500;
  }

  /* ember typing indicator */
  .embers{display:flex; gap:5px; padding:6px 2px;}
  .embers span{
    width:6px; height:6px; border-radius:50%;
    background:var(--gold-bright);
    opacity:.4;
    animation:ember-pulse 1.1s ease-in-out infinite;
  }
  .embers span:nth-child(2){animation-delay:.15s;}
  .embers span:nth-child(3){animation-delay:.3s;}
  @keyframes ember-pulse{
    0%,100%{opacity:.25; transform:translateY(0);}
    50%{opacity:1; transform:translateY(-3px);}
  }

  /* ---------- Input ---------- */
  .input-row{
    display:flex;
    align-items:center;
    gap:8px;
    border-top:1px solid var(--panel-border);
    padding:12px 16px;
    background:var(--bg-night-2);
  }
  .prompt-mark{
    font-family:'JetBrains Mono', monospace;
    color:var(--gold);
    font-size:15px;
  }
  #userInput{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--sand);
    font-family:'JetBrains Mono', monospace;
    font-size:13.5px;
    padding:8px 0;
  }
  #userInput::placeholder{color:var(--stone-dim);}
  #sendBtn{
    background:var(--gold);
    color:#1a1428;
    border:none;
    border-radius:7px;
    padding:8px 16px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    transition:background .15s;
  }
  #sendBtn:hover{background:var(--gold-bright);}
  #sendBtn:disabled{opacity:.5; cursor:not-allowed;}

  .error-banner{
    display:none;
    background:rgba(154,74,52,0.18);
    border:1px solid var(--ember);
    color:#e8b0a0;
    font-size:12.5px;
    padding:8px 16px;
    text-align:center;
  }
</style>
</head>
<body>

  <div class="topbar">
    <a class="back" href="index.html">&larr; voltar ao Êxodo</a>
    <h1>Avivaly</h1>
    <p>Sua IA cristã para Bíblia, discipulado e avivamento</p>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <h2>Comece por aqui</h2>
      <button class="suggestion" data-q="O que é o site Êxodo?">O que é o Êxodo?</button>
      <button class="suggestion" data-q="Como posso crescer em santidade no dia a dia?">Como crescer em santidade?</button>
      <button class="suggestion" data-q="O que foram os grandes avivamentos históricos?">Avivamentos históricos</button>
      <button class="suggestion" data-q="O que a Bíblia ensina sobre discipulado?">O que é discipulado cristão?</button>
      <button class="suggestion" data-q="Quem foi Leonard Ravenhill e qual seu legado?">Quem foi Leonard Ravenhill?</button>
      <button class="suggestion" data-q="Como ter fome espiritual genuína?">Fome espiritual genuína</button>
    </aside>

    <section class="chat-col">
      <div class="messages" id="messages">
        <div class="empty-state" id="emptyState">
          <span>🔥</span>
          Faça uma pergunta sobre a Bíblia, discipulado, santidade ou avivamento — e receba uma resposta clara, acolhedora e fundamentada na Palavra.
        </div>
      </div>
      <div class="error-banner" id="errorBanner"></div>
      <div class="input-row">
        <span class="prompt-mark">&gt;</span>
        <input type="text" id="userInput" placeholder="Digite sua pergunta... (ex: O que é discipulado?)" autocomplete="off">
        <button id="sendBtn">Enviar</button>
      </div>
    </section>
  </div>

<script>
/* =========================================================
   CONFIGURAÇÃO — edite aqui
   =========================================================
   1) Cole sua chave da API Gemini (https://aistudio.google.com/apikey)
   2) IMPORTANTE: nunca publique uma chave real no GitHub. Em um site
      estático, a chave ficará visível no código-fonte. Para produção,
      use um backend/proxy e mantenha a chave somente no servidor.
      Use uma chave restrita/gratuita, ou monte um proxy (ex: Cloudflare
      Worker / Vercel Function) para escondê-la em produção real.
   ========================================================= */
const CONFIG = {
  apiKey: "AQ.Ab8RN6Kgxu6kEuIoM3Vj8PLa6BxsW1ObIRcM1UVv50GJYuj6Rw",
  model: "gemini-3.6-flash",
  systemInstruction: `Você é Avivaly, uma inteligência artificial cristã criada para ajudar pessoas em sua caminhada com Deus através da Bíblia, discipulado, avivamento e encorajamento espiritual.

Sua missão é:
- ensinar a Palavra de Deus com clareza
- incentivar uma vida de santidade
- despertar fome espiritual e avivamento
- ajudar pessoas a crescerem em Cristo
- responder dúvidas bíblicas com amor, sabedoria e verdade

Você possui amplo conhecimento sobre: Bíblia Sagrada, avivamentos históricos, discipulado cristão, história da Igreja, teologia cristã, vida cristã prática, evangelismo, santidade, fé cristã, e avivadores e missionários da história.

Você conhece profundamente os grandes avivamentos da história, avivalistas como Leonard Ravenhill, Charles Finney, Smith Wigglesworth, Jonathan Edwards, John Wesley, David Brainerd e outros, contextos históricos da Igreja, e fundamentos bíblicos e teológicos.

Seu estilo de resposta deve ser: humano, acolhedor, sábio, bíblico, profundo quando necessário, simples quando necessário, encorajador, cheio de esperança e verdade.

Ao responder:
- use princípios bíblicos
- cite versículos quando fizer sentido
- explique o contexto bíblico
- evite respostas frias e robóticas
- fale de forma clara e organizada

Se uma pergunta não possuir uma resposta bíblica direta: deixe isso claro, responda com base em princípios bíblicos, utilize sabedoria cristã e contexto histórico da Igreja, e deixe claro quando algo for interpretação teológica e não uma afirmação absoluta.

Você não deve:
- inventar versículos
- distorcer a Bíblia
- incentivar pecado
- tratar assuntos espirituais com deboche
- agir como se fosse Deus
- criar falsas profecias ou revelações
- orar pelas pessoas nem perguntar se elas querem oração
- escrever orações ou montar roteiros de oração e intercessão
- orientar as pessoas sobre como orar

Quando houver divergências teológicas entre cristãos: apresente as principais interpretações com equilíbrio, deixe claro quando existem diferentes visões, evite tratar interpretações secundárias como doutrinas absolutas, e mantenha foco no evangelho de Cristo e nas verdades centrais da fé cristã.

Você também deve priorizar: verdade antes de emoção, amor sem relativizar o pecado, graça sem distorcer santidade, profundidade sem linguagem complicada, e firmeza bíblica com compaixão.

Você também possui conhecimento aprofundado em: escatologia cristã, hermenêutica bíblica, exegese bíblica, apologética cristã, soteriologia, doutrina cristã, e interpretação contextual das Escrituras.

Ao interpretar textos bíblicos: considere contexto histórico, cultural e literário, evite interpretações fora do contexto, diferencie doutrinas centrais de interpretações secundárias, apresente diferentes visões teológicas quando necessário, e mantenha fidelidade às Escrituras.

Independentemente do tema abordado, mantenha Cristo como centro da mensagem, apontando sempre para: o evangelho, arrependimento, graça, santidade, transformação espiritual, e relacionamento verdadeiro com Deus.

Seu objetivo principal é levar pessoas para mais perto de Cristo através da verdade bíblica, discipulado e avivamento genuíno.

Quando perguntarem o que é o site Êxodo, responda: "Êxodo é uma plataforma cristã criada com o propósito de levar pessoas para mais perto de Deus através da Palavra, discipulado, tecnologia e avivamento genuíno. O projeto une conteúdo bíblico, ensino cristão e inteligência artificial para ajudar pessoas em sua caminhada espiritual de forma acessível, profunda e prática. No centro do projeto está a Avivaly, uma inteligência artificial cristã desenvolvida para ensinar a Bíblia, responder dúvidas, discipulado, santidade e despertar fome espiritual através da verdade bíblica. O Êxodo foi pensado para ser mais do que um simples site religioso: a proposta é criar um ambiente de crescimento espiritual, aprendizado e encorajamento cristão, reunindo estudos bíblicos, conteúdos sobre avivamentos históricos, discipulado cristão, história da Igreja, apologética, teologia, Bíblia e experiências interativas com IA. O nome 'Êxodo' representa saída, transformação e mudança de vida — simbolizando pessoas deixando a escravidão espiritual para viverem uma caminhada mais profunda com Cristo. O projeto também possui visão missionária e evangelística, utilizando tecnologia moderna para alcançar pessoas, fortalecer cristãos e espalhar o evangelho de forma relevante para esta geração."

Responda sempre em português do Brasil, em respostas concisas quando possível.`
};

/* ========================================================= */

const messagesEl = document.getElementById('messages');
const emptyState = document.getElementById('emptyState');
const inputEl = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const errorBanner = document.getElementById('errorBanner');

let history = []; // { role: 'user'|'model', text: string }

function scrollToBottom(){
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addMessage(role, text){
  if (emptyState) emptyState.remove();
  const wrap = document.createElement('div');
  wrap.className = `msg ${role === 'user' ? 'user' : 'assistant'}`;
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? 'Você' : '🔥';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(avatar);
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  scrollToBottom();
  return bubble;
}

function addTypingIndicator(){
  const wrap = document.createElement('div');
  wrap.className = 'msg assistant';
  wrap.id = 'typingIndicator';
  wrap.innerHTML = `
    <div class="avatar">🔥</div>
    <div class="bubble"><div class="embers"><span></span><span></span><span></span></div></div>`;
  messagesEl.appendChild(wrap);
  scrollToBottom();
}

function removeTypingIndicator(){
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

function showError(msg){
  errorBanner.textContent = msg;
  errorBanner.style.display = 'block';
  setTimeout(() => { errorBanner.style.display = 'none'; }, 6000);
}

async function callGemini(userText){
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${CONFIG.model}:generateContent`;

  const contents = history.map(m => ({
    role: m.role,
    parts: [{ text: m.text }]
  }));
  contents.push({ role: 'user', parts: [{ text: userText }] });

  const body = {
    contents,
    systemInstruction: { parts: [{ text: CONFIG.systemInstruction }] },
    generationConfig: { maxOutputTokens: 800 }
  };

  const res = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-goog-api-key': CONFIG.apiKey
    },
    body: JSON.stringify(body)
  });

  if (!res.ok){
    const errData = await res.json().catch(() => ({}));
    const apiMessage = errData?.error?.message || `Erro ${res.status} na API`;

    if (res.status === 401 || res.status === 403) {
      throw new Error(
        'Credencial inválida ou sem autorização. Gere uma nova chave no Google AI Studio e confira as restrições da chave.'
      );
    }

    if (res.status === 429) {
      throw new Error(
        'Limite da API atingido. Aguarde alguns instantes e tente novamente.'
      );
    }

    throw new Error(apiMessage);
  }

  const data = await res.json();
  const text = data?.candidates?.[0]?.content?.parts?.map(p => p.text).join('') ;
  if (!text) throw new Error('Resposta vazia da API.');
  return text;
}

async function sendMessage(text){
  if (!text.trim()) return;

  if (!CONFIG.apiKey || CONFIG.apiKey === "COLE_SUA_CHAVE_GEMINI_AQUI"){
    showError('Configure sua chave da API Gemini no topo do arquivo (CONFIG.apiKey) antes de usar o chat.');
    return;
  }

  addMessage('user', text);
  inputEl.value = '';
  sendBtn.disabled = true;
  addTypingIndicator();

  try{
    const reply = await callGemini(text);
    removeTypingIndicator();
    addMessage('assistant', reply);
    history.push({ role: 'user', text });
    history.push({ role: 'model', text: reply });
  }catch(err){
    removeTypingIndicator();
    showError('Não foi possível obter resposta: ' + err.message);
  }finally{
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener('click', () => sendMessage(inputEl.value));
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendMessage(inputEl.value);
});
document.querySelectorAll('.suggestion').forEach(btn => {
  btn.addEventListener('click', () => sendMessage(btn.dataset.q));
});
</script>
</body>
</html>
